<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV Playout Automation V6</title><link rel="stylesheet" href="./style.css"></head>
<body><header><div><b>TV PLAYOUT AUTOMATION <span>V6 FINAL</span></b><small>GitHub MP4 • Multi Channel • 24×7 Playout</small></div><strong id="clock">00:00:00</strong></header>
<nav id="channels"></nav><main>
<section class="top">
<div class="card"><h3>PROGRAM OUT <span id="state">READY</span></h3><div class="screen"><video id="program" controls playsinline preload="metadata"></video><b id="chbug">CH 1</b><div id="lower"></div><div id="breaking"></div></div><div class="stats"><div>NOW<strong id="now">—</strong></div><div>REMAINING<strong id="remain">00:00:00</strong></div><div>NEXT<strong id="next">—</strong></div></div></div>
<div class="card"><h3>PREVIEW</h3><video id="preview" muted playsinline controls preload="metadata"></video><div id="previewTitle">—</div><div class="buttons"><button id="take">TAKE</button><button id="play">PLAY</button><button id="pause">PAUSE</button><button id="stop">STOP</button><button id="nextBtn">NEXT</button><button id="estop" class="danger">E-STOP</button></div></div></section>

<section class="card"><h3>GITHUB VIDEOS <span id="scanStatus">SCANNING...</span></h3><div class="toolbar"><button id="scan">SCAN / REFRESH</button><label>Loop <input id="loop" type="checkbox" checked></label><label>Auto Next <input id="auto" type="checkbox" checked></label><label>Schedule <input id="schedule" type="checkbox"></label></div><div id="playlist"></div></section>

<section class="three">
<div class="card"><h3>GRAPHICS</h3><input id="lowerText" placeholder="Lower Third"><button id="lowerBtn">SHOW LOWER THIRD</button><input id="breakingText" placeholder="Breaking News"><button id="breakingBtn">SHOW BREAKING</button><button id="clearGraphics">CLEAR</button></div>
<div class="card"><h3>MANUAL ADD</h3><input id="src" placeholder="videos/filename.mp4"><input id="title" placeholder="Title"><button id="add">ADD TO PLAYLIST</button><p class="hint">अगर auto scan file न दिखाए तो exact repository path जोड़ें।</p></div>
<div class="card"><h3>EVENT LOG</h3><pre id="log"></pre></div></section>
</main><script src="./app.js"></script></body></html>
